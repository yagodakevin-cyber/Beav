name: Release

# 推送 v* 标签时构建三端产物并发布正式 Release。
# 所有产物（桌面安装包、插件 zip、SHA256SUMS.txt）只发布到本仓库，
# 应用内更新器与浏览器插件的更新源均固定绑定本仓库 Releases。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          PLUGIN_VERSION=$(node -p "require('./Plugin/src/manifest.json').version")
          echo "tag=$TAG_VERSION desktop=$PKG_VERSION plugin=$PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::desktop/package.json version ($PKG_VERSION) 与标签 ($TAG_VERSION) 不一致"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Plugin/src/manifest.json version ($PLUGIN_VERSION) 与标签 ($TAG_VERSION) 不一致"
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    needs: verify-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # tauri.conf.json 的 externalBin 引用 ffmpeg/ffprobe sidecar，
      # 这两个大体积二进制不入库，CI 构建前统一从 BtbN/FFmpeg-Builds 下载，
      # 解压后按 Rust target triple 命名放入 desktop/src-tauri/binaries/。
      - name: Download ffmpeg/ffprobe sidecar binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64-gpl.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' `
            -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $ffmpeg = Get-ChildItem -Path $dest -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $dest -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw 'ffmpeg.exe / ffprobe.exe not found in downloaded archive'
          }
          $sidecar = 'desktop/src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $sidecar | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $sidecar 'ffmpeg-x86_64-pc-windows-msvc.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $sidecar 'ffprobe-x86_64-pc-windows-msvc.exe') -Force
          Get-ChildItem $sidecar | Format-Table Name, Length

      # tauri.conf.json 的 resources 引用 ../../Plugin/dist/extension（构建产物，
      # 不入库），必须在桌面包构建前先产出插件 dist。
      - name: Build browser extension resources
        working-directory: Plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Windows installer (NSIS)
        working-directory: desktop
        shell: bash
        env:
          REDBOX_BRAND: beav
        run: |
          pnpm run tauri:preflight
          pnpm exec tauri build --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          find desktop/src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' -exec cp {} dist-release/ \;
          ls -la dist-release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist-release/*

  build-macos:
    runs-on: macos-latest
    needs: verify-version
    # macOS 产物为可选附加项：构建失败不阻断 Windows 安装包的正式发布
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build browser extension resources
        working-directory: Plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build macOS image (DMG)
        working-directory: desktop
        env:
          REDBOX_BRAND: beav
        run: |
          pnpm run tauri:preflight
          pnpm exec tauri build --bundles dmg

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -exec cp {} dist-release/ \;
          ls -la dist-release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-images
          path: dist-release/*

  build-extension:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Install plugin dependencies
        working-directory: Plugin
        run: pnpm install --frozen-lockfile

      - name: Build and package extension
        working-directory: Plugin
        run: |
          pnpm build
          VERSION=$(node -p "require('./src/manifest.json').version")
          mkdir -p dist-release
          (cd dist/extension && zip -qr "../../dist-release/Beav-extension-${VERSION}.zip" .)
          ls -la dist-release

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: Plugin/dist-release/*

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-extension
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-release

      - name: Generate SHA256SUMS.txt
        working-directory: dist-release
        shell: bash
        run: |
          sha256sum --binary * > SHA256SUMS.txt
          # 自体排除在清单外，避免安装包匹配到清单文件本身
          sed -i '/SHA256SUMS.txt/d' SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Beav $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist-release/*
